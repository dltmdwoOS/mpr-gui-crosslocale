[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpr-gui-crosslocale"
version = "0.1.0"
description = "Cross-locale reproduction and analysis tools for MPR-GUI-Bench."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "datasets>=2.20.0",
  "huggingface-hub>=0.24.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

models = [
  "accelerate>=0.33.0,<2",
  "einops==0.8.2",
  "protobuf>=5,<7",
  "sentencepiece==0.2.0",
  "timm>=1.0.7,<2",
  "transformers>=4.57.0,<4.58",
  "qwen-vl-utils>=0.0.14,<0.1",
]

[project.scripts]
mpr-build-manifest = "mpr_crosslocale.data.build_manifest:main"
mpr-build-pilot = "mpr_crosslocale.data.build_pilot:main"
mpr-validate-release = "mpr_crosslocale.data.validate_release:main"
mpr-run-canonical = "mpr_crosslocale.inference.run_canonical:main"
mpr-run-cross-locale = "mpr_crosslocale.inference.run_cross_locale:main"
mpr-build-rel-nllb-translations = "mpr_crosslocale.interventions.build_rel_nllb_translations:main"
mpr-build-rel-nllb-inputs = "mpr_crosslocale.interventions.build_rel_nllb_inputs:main"
mpr-run-rel-nllb-intervention = "mpr_crosslocale.inference.run_rel_nllb_intervention:main"
mpr-validate-rel-nllb-results = "mpr_crosslocale.interventions.validate_rel_nllb_results:main"
mpr-build-rel-contextual-translations = "mpr_crosslocale.interventions.build_rel_qwen3_contextual_translations:main"
mpr-build-rel-contextual-review = "mpr_crosslocale.interventions.build_rel_qwen3_contextual_review:main"
mpr-build-rel-contextual-inputs = "mpr_crosslocale.interventions.build_rel_qwen3_contextual_inputs:main"
mpr-run-rel-contextual-intervention = "mpr_crosslocale.inference.run_rel_contextual_intervention:main"
mpr-validate-rel-contextual-results = "mpr_crosslocale.interventions.validate_rel_nllb_results:main"
mpr-summarize-cross-locale = "mpr_crosslocale.analysis.summarize_cross_locale:main"
mpr-processor-preflight = "mpr_crosslocale.inference.processor_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
