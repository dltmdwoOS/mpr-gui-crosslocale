<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 위치 표시</title>
<style>
  :root { font-family: system-ui, "Noto Sans", sans-serif; color: #17212e; background: #edf1f6; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, select, input, textarea { font: inherit; }
  button { padding: 6px 9px; border: 1px solid #a9b8c9; border-radius: 6px; background: white; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.selected { background: #d9ebff; border-color: #2266a8; }
  button.primary { color: white; background: #195ca5; border-color: #195ca5; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 8px 12px; background: white; border-bottom: 1px solid #cad4df; }
  header strong { margin-right: 8px; }
  header a { color: #195ca5; }
  #position { width: 4.2em; padding: 6px; }
  .spacer { flex: 1; }
  main { padding: 9px; }
  #title { margin: 0 0 7px; font-size: .95rem; overflow-wrap: anywhere; }
  #tip { margin: 0 0 8px; color: #52657a; font-size: .85rem; }
  #cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { min-width: 0; padding: 8px; background: white; border: 1px solid #cad4df; border-radius: 8px; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .card-top strong { font-size: 1.05rem; }
  .badge { color: #496175; font-size: .82rem; }
  .card-top button { margin-left: auto; }
  .question { margin: 0 0 5px; min-height: 2.4em; line-height: 1.2; font-size: .91rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  mark { background: #ffeb8a; }
  .image-area { height: min(30vh, 330px); min-height: 160px; display: flex; justify-content: center; align-items: center; overflow: auto; background: #253244; }
  .image-wrap { position: relative; display: inline-block; flex: none; max-width: 100%; max-height: 100%; }
  .image-wrap img { display: block; max-width: 100%; max-height: min(30vh, 330px); width: auto; height: auto; }
  .image-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 5px; margin-top: 6px; }
  .fields label, .extra label { font-size: .79rem; color: #41566a; }
  .fields select, .fields input, .extra select, .extra textarea { display: block; width: 100%; padding: 5px; border: 1px solid #a9b8c9; border-radius: 4px; background: white; color: #17212e; }
  .card-actions { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
  .card-actions button { padding: 3px 7px; font-size: .78rem; }
  .card-actions span { color: #52657a; font-size: .77rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details { margin-top: 5px; font-size: .82rem; }
  summary { color: #195ca5; cursor: pointer; }
  .extra { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 6px; }
  .extra .wide { grid-column: 1 / -1; }
  .options { color: #41566a; max-height: 6em; overflow: auto; }
  .options div { margin: 2px 0; }
  textarea { min-height: 45px; resize: vertical; }
  footer { position: sticky; bottom: 0; z-index: 9; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: white; border-top: 1px solid #cad4df; }
  #message { flex: 1; font-size: .86rem; }
  .card.expanded { position: fixed; inset: 8px; z-index: 20; overflow: auto; box-shadow: 0 0 0 100vmax #17212ebb; }
  .card.expanded .image-area { height: calc(100vh - 245px); }
  .card.expanded .image-wrap img { max-height: calc(100vh - 245px); }
  .card.expanded .question { display: block; min-height: 0; }
  @media (max-width: 700px) { #cards { grid-template-columns: 1fr; } header { position: static; } .image-area { height: 40vh; } .image-wrap img { max-height: 40vh; } }
</style>
</head>
<body>
<header>
  <strong id="app-title">화면 위치 표시</strong>
  <span id="progress"></span>
  <button id="previous" disabled>←</button>
  <input id="position" type="number" min="1" aria-label="문항 번호" disabled>
  <button id="jump" disabled>이동</button>
  <button id="next" disabled>→</button>
  <span class="spacer"></span>
  <button id="mode-bbox" class="selected">대상 그리기</button>
  <button id="mode-label">글자 그리기</button>
  <button id="undo" title="Ctrl+Z / ⌘Z" disabled>↶ 취소</button>
  <a href="/api/export">내보내기</a>
</header>
<main>
  <p id="title"></p>
  <p id="tip">노란 말을 참고해 네 화면의 같은 대상을 드래그하세요. 작은 요소는 ‘크게’로 확대할 수 있습니다.</p>
  <div id="cards"></div>
</main>
<footer>
  <span id="message"></span>
  <button id="save" disabled>4개 저장</button>
  <button id="save-next" class="primary" disabled>저장하고 다음 →</button>
</footer>
<script>
"use strict";
const LANGUAGES = ["en", "zh", "th", "ru"];
const el = id => document.getElementById(id);
let manifest, annotations, annotatorId, itemIndex = 0, drafts = {}, dirty = new Set();
let mode = "bbox", dragging = null, undoStack = [], saving = false;
const item = () => manifest.items[itemIndex];
const locale = lang => item().locales[lang];
const clone = value => JSON.parse(JSON.stringify(value));

function message(value, error = false) {
  el("message").textContent = value;
  el("message").style.color = error ? "#a01a22" : "#17623c";
}
function defaultDraft(lang) {
  const saved = (annotations[item().parallel_id] || {})[lang];
  return clone(saved || {
    anchor_phrase: locale(lang).stem_span.text, status: "", element_role: null,
    reference_equivalence: "yes", options_equivalence: "yes",
    bbox: null, label_bbox: null, note: ""
  });
}
function markDirty(lang) {
  dirty.add(lang);
  badge(lang);
}
function remember(lang) {
  undoStack.push({lang: lang, draft: clone(drafts[lang]), wasDirty: dirty.has(lang)});
  if (undoStack.length > 30) undoStack.shift();
  el("undo").disabled = false;
}
function undo() {
  if (!undoStack.length) return;
  const previous = undoStack.pop();
  drafts[previous.lang] = previous.draft;
  if (previous.wasDirty) dirty.add(previous.lang); else dirty.delete(previous.lang);
  syncCard(previous.lang);
  el("undo").disabled = undoStack.length === 0;
  message("되돌렸습니다.");
}
function confirmLeave() {
  return !dirty.size || confirm("저장하지 않은 표시가 있습니다. 이동할까요?");
}
function highlight(parent, value, spans) {
  let offset = 0;
  for (const span of [...spans].sort((a, b) => a.start - b.start)) {
    parent.append(document.createTextNode(value.slice(offset, span.start)));
    const mark = document.createElement("mark");
    mark.textContent = value.slice(span.start, span.end);
    parent.append(mark);
    offset = span.end;
  }
  parent.append(document.createTextNode(value.slice(offset)));
}
function card(lang) { return document.getElementById("card-" + lang); }
function badge(lang) {
  const saved = (annotations[item().parallel_id] || {})[lang];
  card(lang).querySelector(".badge").textContent = dirty.has(lang) ? "수정 중" : (saved ? "저장됨 ✓" : "");
}
function draw(lang) {
  const canvas = card(lang).querySelector("canvas"), context = canvas.getContext("2d");
  context.clearRect(0, 0, canvas.width, canvas.height);
  for (const [key, color] of [["bbox", "#1581e3"], ["label_bbox", "#ff9c24"]]) {
    const box = dragging && dragging.lang === lang && dragging.key === key ? dragging.preview : drafts[lang][key];
    if (!box) continue;
    context.fillStyle = color + "38";
    context.strokeStyle = color;
    context.lineWidth = Math.max(3, canvas.width / 450);
    context.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]);
    context.strokeRect(box[0], box[1], box[2] - box[0], box[3] - box[1]);
  }
  const info = card(lang).querySelector(".box-info");
  info.textContent = (drafts[lang].bbox ? "대상 ✓" : "대상 없음") +
    (drafts[lang].label_bbox ? " · 글자 ✓" : "");
}
function syncCard(lang) {
  const root = card(lang), data = drafts[lang];
  for (const [field, selector] of [
    ["status", ".status"], ["element_role", ".role"], ["anchor_phrase", ".phrase"],
    ["reference_equivalence", ".reference-equivalence"], ["options_equivalence", ".options-equivalence"],
    ["note", ".note"]
  ]) root.querySelector(selector).value = data[field] || (field.endsWith("equivalence") ? "yes" : "");
  root.querySelector(".role").disabled = data.status !== "valid";
  badge(lang);
  draw(lang);
}
function point(event, lang) {
  const rect = card(lang).querySelector("canvas").getBoundingClientRect();
  const data = locale(lang);
  return [
    Math.max(0, Math.min(data.width, Math.round((event.clientX - rect.left) * data.width / rect.width))),
    Math.max(0, Math.min(data.height, Math.round((event.clientY - rect.top) * data.height / rect.height)))
  ];
}
function addCard(lang) {
  const data = locale(lang), root = document.createElement("article");
  root.id = "card-" + lang;
  root.className = "card";
  root.innerHTML = '<div class="card-top"><strong></strong><span class="badge"></span><button class="expand">크게</button></div>' +
    '<p class="question"></p><div class="image-area"><div class="image-wrap"><img alt="GUI 화면"><canvas></canvas></div></div>' +
    '<div class="fields"><label>상태<select class="status"><option value="">선택</option><option value="valid">찾음</option>' +
    '<option value="ambiguous">대상 애매함</option><option value="multiple_matches">여러 개</option>' +
    '<option value="absent">없음</option><option value="unpointable">위치 지정 불가</option>' +
    '<option value="screenshot_error">이미지 오류</option></select></label>' +
    '<label>종류<select class="role"><option value="">선택</option><option value="button">버튼</option>' +
    '<option value="label">글자</option><option value="control">입력·스위치</option><option value="section">영역</option>' +
    '<option value="row">한 줄</option><option value="icon">아이콘</option><option value="other">기타</option></select></label>' +
    '<label>가리키는 말<input class="phrase" autocomplete="off"></label></div>' +
    '<div class="card-actions"><button class="clear-bbox">대상 지우기</button><button class="clear-label">글자 지우기</button>' +
    '<span class="box-info"></span></div>' +
    '<details><summary>추가 확인 · 메모</summary><div class="extra">' +
    '<label>영어와 같은 뜻? · 가리키는 말<select class="reference-equivalence">' +
    '<option value="yes">예</option><option value="no">아니요</option><option value="uncertain">모름</option></select></label>' +
    '<label>영어와 같은 뜻? · 선택지<select class="options-equivalence">' +
    '<option value="yes">예</option><option value="no">아니요</option><option value="uncertain">모름</option></select></label>' +
    '<label class="wide">이유 / 메모<textarea class="note"></textarea></label>' +
    '<div class="options wide"></div></div></details>';
  root.querySelector("strong").textContent = lang.toUpperCase();
  root.querySelector(".question").title = data.question_stem;
  highlight(root.querySelector(".question"), data.question_stem, [data.stem_span]);
  const options = root.querySelector(".options");
  for (const letter of "ABCD") {
    const row = document.createElement("div");
    row.append(document.createTextNode(letter + " · "));
    highlight(row, data.options[letter], data.option_spans[letter]);
    options.append(row);
  }
  root.querySelector(".expand").onclick = () => {
    root.classList.toggle("expanded");
    root.querySelector(".expand").textContent = root.classList.contains("expanded") ? "작게" : "크게";
  };
  for (const [field, selector] of [
    ["element_role", ".role"], ["anchor_phrase", ".phrase"],
    ["reference_equivalence", ".reference-equivalence"], ["options_equivalence", ".options-equivalence"],
    ["note", ".note"]
  ]) {
    root.querySelector(selector).addEventListener("input", event => {
      drafts[lang][field] = event.target.value;
      markDirty(lang);
      if (field.endsWith("equivalence") && event.target.value !== "yes") root.querySelector("details").open = true;
    });
  }
  root.querySelector(".status").addEventListener("change", event => {
    if (drafts[lang].status === event.target.value) return;
    remember(lang);
    drafts[lang].status = event.target.value;
    if (event.target.value !== "valid") {
      drafts[lang].bbox = null;
      drafts[lang].label_bbox = null;
      drafts[lang].element_role = null;
      root.querySelector(".role").value = "";
      if (event.target.value) root.querySelector("details").open = true;
    }
    root.querySelector(".role").disabled = event.target.value !== "valid";
    markDirty(lang);
    draw(lang);
  });
  for (const [selector, key] of [[".clear-bbox", "bbox"], [".clear-label", "label_bbox"]]) {
    root.querySelector(selector).onclick = () => {
      if (!drafts[lang][key]) return;
      remember(lang);
      drafts[lang][key] = null;
      markDirty(lang);
      draw(lang);
    };
  }
  const image = root.querySelector("img"), canvas = root.querySelector("canvas");
  image.onload = () => {
    canvas.width = data.width;
    canvas.height = data.height;
    draw(lang);
  };
  image.onerror = () => message(lang.toUpperCase() + " 이미지를 열지 못했습니다.", true);
  canvas.addEventListener("pointerdown", event => {
    if (!image.complete || !image.naturalWidth) return;
    const start = point(event, lang);
    dragging = {lang: lang, key: mode, start: start, preview: [start[0], start[1], start[0], start[1]]};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", event => {
    if (!dragging || dragging.lang !== lang) return;
    const start = dragging.start, end = point(event, lang);
    dragging.preview = [Math.min(start[0], end[0]), Math.min(start[1], end[1]),
      Math.max(start[0], end[0]), Math.max(start[1], end[1])];
    draw(lang);
  });
  canvas.addEventListener("pointerup", event => {
    if (!dragging || dragging.lang !== lang) return;
    const start = dragging.start, end = point(event, lang);
    const box = [Math.min(start[0], end[0]), Math.min(start[1], end[1]),
      Math.max(start[0], end[0]), Math.max(start[1], end[1])];
    if (box[2] > box[0] && box[3] > box[1] &&
        JSON.stringify(box) !== JSON.stringify(drafts[lang][dragging.key])) {
      remember(lang);
      drafts[lang][dragging.key] = box;
      if (dragging.key === "bbox") {
        drafts[lang].status = "valid";
        root.querySelector(".status").value = "valid";
        root.querySelector(".role").disabled = false;
      }
      markDirty(lang);
    }
    dragging = null;
    draw(lang);
  });
  canvas.addEventListener("pointercancel", () => { dragging = null; draw(lang); });
  el("cards").append(root);
  syncCard(lang);
  image.src = "/api/image?pid=" + encodeURIComponent(item().parallel_id) + "&lang=" + lang;
}
function updateHeader() {
  const savedCount = Object.values(annotations).reduce((count, group) => count + Object.keys(group).length, 0);
  el("progress").textContent = savedCount + "/" + (manifest.items.length * 4);
  el("position").value = itemIndex + 1;
  el("position").max = manifest.items.length;
  el("previous").disabled = itemIndex === 0;
  el("next").disabled = itemIndex === manifest.items.length - 1;
  el("position").disabled = false;
  el("jump").disabled = false;
  el("save").disabled = false;
  el("save-next").disabled = false;
  const isPilot = (manifest.pilot_item_ids || []).includes(item().parallel_id);
  el("title").textContent = (itemIndex + 1) + "/" + manifest.items.length + " · " +
    item().parallel_id + (isPilot ? " · 파일럿 문항" : "");
}
function render() {
  drafts = {};
  dirty.clear();
  undoStack = [];
  el("undo").disabled = true;
  dragging = null;
  el("cards").replaceChildren();
  for (const lang of LANGUAGES) drafts[lang] = defaultDraft(lang);
  for (const lang of LANGUAGES) addCard(lang);
  updateHeader();
  message("");
}
function move(index) {
  if (!Number.isInteger(index) || index < 0 || index >= manifest.items.length) {
    el("position").value = itemIndex + 1;
    message("1부터 " + manifest.items.length + " 사이의 번호를 입력하세요.", true);
    return;
  }
  if (!confirmLeave()) { el("position").value = itemIndex + 1; return; }
  itemIndex = index;
  render();
}
function validateDrafts() {
  for (const lang of LANGUAGES) {
    const data = drafts[lang], source = locale(lang), label = lang.toUpperCase();
    const phrase = data.anchor_phrase.trim(), anchor = source.stem_span.text;
    if (!phrase || !source.question_stem.includes(phrase) || phrase.split(anchor).length !== 2)
      return label + ": ‘가리키는 말’은 노란 표현이 한 번 들어간 질문의 일부여야 합니다.";
    if (!data.status) return label + ": 상태를 고르세요.";
    if (data.status === "valid" && (!data.bbox || !data.element_role))
      return label + ": 대상을 그리고 종류를 고르세요.";
    if (data.status !== "valid" && (data.bbox || data.label_bbox))
      return label + ": 대상을 찾지 못했다면 상자를 지우세요.";
    if ((data.status !== "valid" || data.reference_equivalence !== "yes" ||
         data.options_equivalence !== "yes") && !data.note.trim()) {
      card(lang).querySelector("details").open = true;
      return label + ": 이유를 메모에 적으세요.";
    }
  }
  return null;
}
async function save(advance) {
  if (saving) return;
  const error = validateDrafts();
  if (error) { message(error, true); return; }
  saving = true;
  el("save").disabled = true;
  el("save-next").disabled = true;
  try {
    const response = await fetch("/api/item", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({parallel_id: item().parallel_id, annotations: drafts})
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || "저장에 실패했습니다.");
    }
    const result = await response.json();
    annotations[item().parallel_id] = result.annotations;
    dirty.clear();
    undoStack = [];
    el("undo").disabled = true;
    updateHeader();
    for (const lang of LANGUAGES) badge(lang);
    message("저장했습니다.");
    if (advance && itemIndex < manifest.items.length - 1) { itemIndex += 1; render(); }
  } catch (error) { message(error.message, true); }
  finally { saving = false; el("save").disabled = false; el("save-next").disabled = false; }
}
el("previous").onclick = () => move(itemIndex - 1);
el("next").onclick = () => move(itemIndex + 1);
el("jump").onclick = () => move(Number(el("position").value) - 1);
el("position").addEventListener("keydown", event => { if (event.key === "Enter") move(Number(el("position").value) - 1); });
for (const [id, key] of [["mode-bbox", "bbox"], ["mode-label", "label_bbox"]]) {
  el(id).onclick = () => {
    mode = key;
    el("mode-bbox").classList.toggle("selected", key === "bbox");
    el("mode-label").classList.toggle("selected", key === "label_bbox");
  };
}
el("undo").onclick = undo;
el("save").onclick = () => save(false);
el("save-next").onclick = () => save(true);
document.addEventListener("keydown", event => {
  if (!(event.ctrlKey || event.metaKey) || event.shiftKey || event.key.toLowerCase() !== "z") return;
  if (event.target.closest?.("input, textarea, [contenteditable]")) return;
  if (dragging) { event.preventDefault(); const lang = dragging.lang; dragging = null; draw(lang); return; }
  if (undoStack.length) { event.preventDefault(); undo(); }
});
window.addEventListener("beforeunload", event => {
  if (dirty.size) { event.preventDefault(); event.returnValue = ""; }
});
fetch("/api/state").then(async response => {
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}).then(data => {
  manifest = data.manifest;
  annotations = data.annotations;
  annotatorId = data.annotator_id;
  el("app-title").textContent = "위치 표시 · " + annotatorId;
  render();
}).catch(error => message("목록을 열지 못했습니다: " + error.message, true));
</script>
</body>
</html>
