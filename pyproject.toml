[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpr-gui-crosslocale"
version = "0.1.0"
description = "Cross-locale reproduction and analysis tools for MPR-GUI-Bench."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "datasets>=2.20.0",
  "huggingface-hub>=0.24.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

models = [
  "accelerate>=0.33.0,<2",
  "einops==0.8.2",
  "torch==2.9.1",
  "transformers>=4.45.0,<5",
  "qwen-vl-utils>=0.0.8,<0.1",
]

[project.scripts]
mpr-build-manifest = "mpr_crosslocale.data.build_manifest:main"
mpr-validate-release = "mpr_crosslocale.data.validate_release:main"
mpr-run-canonical = "mpr_crosslocale.inference.run_canonical:main"
mpr-processor-preflight = "mpr_crosslocale.inference.processor_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
